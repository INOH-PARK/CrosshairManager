name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build (warnings are errors)
        shell: powershell
        run: dotnet build CrosshairManager.sln -c Debug

      # Screen tests (overlay capture, input injection, FlaUI) need a real desktop and run locally
      # through scripts\verify.ps1. CI runs only the window-free suites.
      - name: Core tests
        shell: powershell
        run: dotnet test tests/CrosshairManager.Core.Tests -c Debug --no-build --logger "trx;LogFileName=core.trx" --results-directory TestResults

      - name: Desktop tests (window-free)
        shell: powershell
        run: dotnet test tests/CrosshairManager.Desktop.Tests -c Debug --no-build --filter "FullyQualifiedName~CrosshairManager.Desktop.Tests.App.|FullyQualifiedName~CrosshairManager.Desktop.Tests.Cli.CliTests" --logger "trx;LogFileName=desktop.trx" --results-directory TestResults

      - name: Localization key parity
        shell: powershell
        run: dotnet test tests/CrosshairManager.Ui.Tests -c Debug --no-build --filter "FullyQualifiedName~LocalizationTests.l1_" --logger "trx;LogFileName=ui-l1.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
